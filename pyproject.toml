[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twilight-struggle-env"
version = "0.1.0"
description = "A Twilight Struggle environment for testing and training agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["twilight*"]

[tool.setuptools.package-data]
twilight = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # Event handlers take (game, ctx) for a uniform registry signature; many do not
    # need ctx, and renaming it would break that uniformity.
    "ARG001",
]
